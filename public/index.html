<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f6f5ef"
  >

  <title>
    Genze AI Beauty Consultant
  </title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <main class="page">

    <!-- =========================================
         VOICE BEAUTY CONSULTANT
    ========================================== -->

    <section class="consultant">

      <header class="consultant-header">

        <div>
          <h1>
            Voice Beauty Consultant
          </h1>

          <p id="consultantStatus">
            Choose your skin tone to begin
          </p>
        </div>

        <button
          id="voiceBtn"
          class="voice-button"
          type="button"
        >
          Enable voice
        </button>

      </header>


      <!-- CHAT -->

      <div
        id="chat"
        class="chat"
      >

        <div class="assistant-message">

          <span class="avatar">
            G
          </span>

          <div class="bubble assistant">
            Welcome to Genze Hub. First,
            choose your skin tone.
          </div>

        </div>

      </div>


      <!-- PRODUCTS INSIDE CONSULTANT -->

      <div
        id="consultantProducts"
        class="consultant-products hidden"
      ></div>


      <!-- CONTROLS -->

      <div class="consultant-controls">

        <div class="control-row">

          <label for="concernSelect">
            Choose a concern
          </label>

          <select id="concernSelect">
            <option value="">
              See all beauty concerns
            </option>
          </select>

        </div>


        <div class="search-row">

          <button
            id="micBtn"
            type="button"
            class="mic-button"
            aria-label="Voice search"
          >
            🎙
          </button>

          <input
            id="searchInput"
            placeholder="Search all products..."
          >

          <button
            id="searchBtn"
            type="button"
            class="send-button"
          >
            ↑
          </button>

        </div>


        <!-- TONE -->

        <div class="tone-section">

          <div class="section-label">
            Skin tone
          </div>

          <div
            id="toneButtons"
            class="choice-row"
          >
            <button data-tone="Fair">Fair</button>
            <button data-tone="Light">Light</button>
            <button data-tone="Medium">Medium</button>
            <button data-tone="Tan">Tan</button>
            <button data-tone="Deep">Deep</button>
          </div>

        </div>


        <!-- CATEGORY -->

        <div
          id="categoryButtons"
          class="category-row"
        >

          <button
            data-category="skincare"
            class="active"
          >
            Skincare
          </button>

          <button
            data-category="makeup"
          >
            Makeup
          </button>

          <button
            data-category="haircare"
          >
            Haircare
          </button>

          <button
            data-category="fragrance"
          >
            Fragrance
          </button>

        </div>


        <!-- QUICK CONCERNS -->

        <div
          id="quickConcerns"
          class="quick-grid"
        ></div>

      </div>

    </section>


    <!-- =========================================
         CAMERA - SEPARATE FEATURE
    ========================================== -->

    <section class="camera-card">

      <div>
        <p class="eyebrow">
          AI SKIN ANALYSIS
        </p>

        <h2>
          Scan your skin
        </h2>

        <p class="muted">
          Camera analysis is separate from
          the Voice Beauty Consultant.
        </p>
      </div>


      <label class="consent">

        <input
          type="checkbox"
          id="consentCheckbox"
        >

        <span>
          I consent to securely send this
          photo for AI skin analysis.
        </span>

      </label>


      <div class="camera-actions">

        <button
          id="openCameraBtn"
          class="dark-button"
          type="button"
        >
          Open Phone Camera
        </button>


        <label class="upload-button">

          Upload Photo

          <input
            id="uploadInput"
            type="file"
            accept="image/*"
            hidden
          >

        </label>

      </div>


      <div
        id="cameraShell"
        class="camera-shell hidden"
      >

        <video
          id="cameraVideo"
          autoplay
          playsinline
          muted
        ></video>

        <div class="face-guide">
          <div class="face-oval"></div>
        </div>

        <button
          id="captureBtn"
          class="capture-button"
          type="button"
        ></button>

        <button
          id="closeCameraBtn"
          class="close-camera"
          type="button"
        >
          ×
        </button>

      </div>


      <canvas
        id="captureCanvas"
        class="hidden"
      ></canvas>


      <img
        id="photoPreview"
        class="photo-preview hidden"
        alt="Skin analysis preview"
      >


      <div
        id="cameraStatus"
        class="camera-status hidden"
      ></div>


      <div
        id="cameraResults"
        class="camera-results hidden"
      ></div>

    </section>

  </main>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.js"></script>
  <script src="app.js"></script>

</body>
</html>
